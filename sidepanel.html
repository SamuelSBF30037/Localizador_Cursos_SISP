<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SISP - Cursos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    h3 {
      margin-top: 0;
      color: #0056b3;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 5px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #004494;
    }
    #statusMessage {
      margin-top: 15px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <h3>Localizador de Cursos</h3>
  
  <div class="input-group">
    <label>Buscar por Data:</label>
    <input type="text" id="dateInput" placeholder="Ex: 12/09/2021">
  </div>
  
  <div class="input-group">
    <label>Buscar por Nome:</label>
    <input type="text" id="nameInput" placeholder="Ex: POP ou DEC">
  </div>
  
  <div style="display: flex; gap: 10px;">
    <button id="searchBtn" style="background-color: #28a745;">Pesquisar</button>
    <button id="clearBtn">Limpar Filtros</button>
  </div>
  
  <div id="statusMessage">Pronto para buscar.</div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
